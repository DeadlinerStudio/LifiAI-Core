[package]
name = "ffi_ohos"
version = "0.1.0"
edition = "2024"

[lib]
name = "ffi_ohos"
crate-type = ["cdylib", "rlib"]

[dependencies]
core_logic = { path = "../core_logic" }
napi-ohos = { version = "1.0", default-features = false, features = ["napi8", "async", "compat-mode"] }
napi-derive-ohos = { version = "1.0" }
serde_json = "1.0"

[build-dependencies]
napi-build-ohos = { version = "1.0" }
