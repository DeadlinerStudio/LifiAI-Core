name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-contract:
    name: Lifecycle Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify lifecycle unit contract
        run: cargo test -p core_logic interfaces::lifecycle_contract::tests -- --nocapture

      - name: Verify lifecycle snapshot fixture contract
        run: cargo test -p core_logic --test lifecycle_snapshot_contract -- --nocapture

      - name: Upload lifecycle snapshot fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadliner-lifecycle-snapshot
          path: core_logic/tests/fixtures/lifecycle_sequences.json
          if-no-files-found: error
          retention-days: 30

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    needs: lifecycle-contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test -p core_logic

  android-build:
    name: Android Bindings Build
    runs-on: ubuntu-latest
    needs: rust-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android artifacts
        env:
          CRATE_NAME: ffi_uniffi
          LIB_NAME: ffi_uniffi
          KOTLIN_PACKAGE: com.aritxonly.deadliner.lifi
        run: ./scripts/build_android.sh

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadliner-android-artifacts
          path: dist/android
          if-no-files-found: warn
          retention-days: 30

  ios-build:
    name: iOS XCFramework Build
    runs-on: macos-14
    needs: rust-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build iOS artifacts
        env:
          PACKAGE_NAME: ffi_uniffi
          LIB_NAME: ffi_uniffi
        run: ./scripts/build_ios_xc.sh

      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadliner-ios-artifacts
          path: dist/ios
          if-no-files-found: warn
          retention-days: 30

  harmony-build:
    name: HarmonyOS Build
    runs-on: macos-14
    needs: rust-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos,x86_64-unknown-linux-ohos

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache Harmony SDK
        uses: actions/cache@v4
        with:
          path: .cache/harmony-sdk
          key: ${{ runner.os }}-harmony-sdk-${{ vars.HARMONY_SDK_RELEASE_REPO || 'harmonyos-dev/hos-sdk' }}-${{ vars.HARMONY_SDK_ASSET_PATTERN || 'auto' }}-${{ vars.HARMONY_SDK_PACKAGES || 'toolchains:9 OpenHarmony/toolchains:9' }}

      - name: Install ohrs
        run: cargo install ohrs --locked

      - name: Setup Harmony SDK
        env:
          HARMONY_SDK_RELEASE_REPO: ${{ vars.HARMONY_SDK_RELEASE_REPO }}
          HARMONY_SDK_FULL_DOWNLOAD_URL: ${{ vars.HARMONY_SDK_FULL_DOWNLOAD_URL }}
          HARMONY_SDK_FULL_ASSET_PATTERN: ${{ vars.HARMONY_SDK_FULL_ASSET_PATTERN }}
          HARMONY_SDK_ASSET_PATTERN: ${{ vars.HARMONY_SDK_ASSET_PATTERN }}
          HARMONY_SDK_DOWNLOAD_URL: ${{ vars.HARMONY_SDK_DOWNLOAD_URL }}
          HARMONY_SDK_PACKAGES: ${{ vars.HARMONY_SDK_PACKAGES }}
          HARMONY_SDK_GITHUB_TOKEN: ${{ secrets.HARMONY_SDK_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/setup_harmony_sdk.sh

      - name: Build Harmony artifacts
        env:
          PACKAGE_NAME: ffi_ohos
        run: ./scripts/build_ohos.sh

      - name: Upload Harmony artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadliner-harmony-artifacts
          path: dist/ohos
          if-no-files-found: warn
          retention-days: 30

  publish-nightly:
    name: Publish Nightly Artifacts
    runs-on: ubuntu-latest
    needs:
      - android-build
      - ios-build
      - harmony-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: deadliner-android-artifacts
          path: release/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: deadliner-ios-artifacts
          path: release/ios

      - name: Download Harmony artifacts
        uses: actions/download-artifact@v4
        with:
          name: deadliner-harmony-artifacts
          path: release/harmony

      - name: Package release archives
        run: |
          mkdir -p bundles
          cd release
          zip -r ../bundles/deadliner-android.zip android
          zip -r ../bundles/deadliner-ios.zip ios
          zip -r ../bundles/deadliner-harmony.zip harmony

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated build artifacts for the latest `master` commit.
            Commit: ${{ github.sha }}
          make_latest: true
          prerelease: true
          files: |
            bundles/deadliner-android.zip
            bundles/deadliner-ios.zip
            bundles/deadliner-harmony.zip
